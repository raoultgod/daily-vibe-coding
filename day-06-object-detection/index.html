<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f0e9">
  <meta name="description" content="카메라 화면에 잡힌 물체를 실시간으로 표시합니다. 영상은 기기 밖으로 전송되지 않습니다.">
  <title>물체 감지</title>
  <link rel="stylesheet" href="/src/theme.css">
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#">물체 감지</a>
    <span id="device" class="model-name">YOLO26n · COCO 80</span>
  </header>
  <main>
    <section class="workspace" aria-label="실시간 물체 인식">
      <div class="view-card">
        <div class="view-topline"><span>카메라 미리보기</span><span id="fps" class="fps">-- FPS</span></div>
        <div id="stage" class="stage">
          <video id="video" autoplay muted playsinline aria-label="카메라 영상"></video>
          <canvas id="overlay" aria-hidden="true"></canvas>
          <div id="empty" class="empty-state">
            <strong>카메라를 시작하세요</strong>
          </div>
          <div id="loading" class="loading-state" hidden><span class="spinner"></span><span id="loadingText">모델 준비 중…</span></div>
        </div>
        <div class="view-footer"><span id="status" role="status" aria-live="polite">카메라가 꺼져 있습니다</span></div>
      </div>

      <aside class="controls" aria-label="카메라와 감지 설정">
        <section class="control-section">
          <h2>카메라</h2>
          <button id="toggleCamera" class="primary-button" type="button"><span class="button-icon">▶</span><span id="buttonLabel">카메라 시작</span></button>
        </section>

        <section class="control-section">
          <div class="section-heading"><h2>감지 기준</h2><output id="thresholdValue" for="threshold">35%</output></div>
          <input id="threshold" type="range" min="15" max="85" value="35" aria-label="감지 기준">
          <div class="range-labels"><span>더 많이</span><span>더 엄격하게</span></div>
        </section>

        <section class="control-section detected-section">
          <div class="section-heading"><h2>찾은 물체</h2><span id="count" class="count-badge">0</span></div>
          <ul id="detections" class="detection-list" aria-live="polite"><li class="no-detections">아직 감지된 물체가 없습니다</li></ul>
        </section>
      </aside>
    </section>
  </main>
  <footer><span>영상 처리는 기기 안에서 이뤄집니다.</span></footer>
</body>
</html>
