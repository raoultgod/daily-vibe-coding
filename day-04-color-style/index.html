<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="분위기에 어울리는 옷 색 조합과 실제 코디 사진">
  <title>오늘의 색 조합</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="palette.js"></script><script defer src="app.js"></script>
</head>
<body>
<main>
  <header><h1>오늘의 색 조합</h1><p>입고 싶은 분위기를 골라보세요.</p></header>
  <div id="moods" class="moods" role="group" aria-label="분위기 선택">
    <button type="button" data-mood="classic" aria-pressed="true">단정한</button>
    <button type="button" data-mood="bold" aria-pressed="false">대담한</button>
  </div>
  <section class="result" aria-label="추천 컬러" aria-live="polite">
    <h2 id="result-title"></h2>
    <p id="result-description" class="description"></p>
    <span id="result-english" class="visually-hidden"></span>
    <h3>기본 컬러</h3>
    <div id="main-swatches" class="swatches"></div>
    <h3>강조 컬러</h3>
    <div id="accent-swatches" class="swatches accent"></div>
    <p id="result-tip" class="tip"></p>
  </section>
  <section class="outfit" aria-labelledby="outfit-heading">
    <h2 id="outfit-heading">이렇게 입어보세요</h2>
    <figure>
      <img id="outfit-photo" src="assets/photos/classic-pexels-975008.jpg" alt="화이트 바탕에 네이비와 레드 줄무늬가 있는 상의와 바지를 입은 사람" width="900" height="1350">
      <figcaption id="photo-description"></figcaption>
    </figure>
  </section>
  <footer>
    <p>색상 견본은 참고용이며, 실제 사진의 색감은 조명과 화면에 따라 달라질 수 있어요.</p>
    <p><a id="palette-source" href="https://jljbacktoclassic.com/archives/40292" target="_blank" rel="noopener noreferrer"></a></p>
    <p><a id="source-link" href="https://www.pexels.com/" target="_blank" rel="noopener noreferrer"></a> · <a id="license-link" href="https://www.pexels.com/license/" target="_blank" rel="noopener noreferrer">사진 라이선스</a></p>
  </footer>
</main>
<noscript>컬러 추천을 보려면 브라우저에서 JavaScript를 켜주세요.</noscript>
</body>
</html>
