<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>한 장 — HWPX 리더</title><style>
@font-face{font-family:Nanum;src:url('./font.ttf')}*{box-sizing:border-box}body{margin:0;color:#262b28;background:#eeefeb;font-family:Nanum,'Malgun Gothic',sans-serif}header{height:68px;background:#fff;border-bottom:1px solid #dedfda;display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:16px;position:sticky;top:0;z-index:2}.brand{font-size:19px;font-weight:bold;white-space:nowrap}.brand small{font-size:11px;color:#8b928c;font-weight:normal;margin-left:10px}.actions{display:flex;gap:8px}button,.choose{border:1px solid #d7dcd5;border-radius:7px;background:#fff;color:#28312b;padding:11px 15px;font:inherit;font-size:13px;cursor:pointer;min-height:44px}.primary{background:#264b3e;color:#fff;border-color:#264b3e}button:disabled{opacity:.4;cursor:not-allowed}button:hover:not(:disabled),.choose:hover{filter:brightness(.95)}input{display:none}.info{max-width:900px;margin:28px auto 12px;padding:0 18px;color:#68716a;font-size:13px;display:flex;justify-content:space-between;gap:12px;overflow-wrap:anywhere}.empty{min-height:calc(100vh - 160px);display:flex;align-items:center;justify-content:center;padding:22px}.drop{width:min(520px,100%);padding:65px 25px;background:#fafbf9;border:1px dashed #adb9ae;text-align:center;border-radius:12px}.drop.drag{background:#e7f0e8;border-color:#39694e}.icon{font-family:serif;font-size:42px;color:#3f654f}.drop h1{font-size:22px;margin:18px 0 10px}.drop p{font-size:14px;color:#737e75;line-height:1.8;margin:0 0 25px}.privacy{font-size:12px;color:#7c887d;margin-top:25px}.pages{padding:0 16px 60px;display:flex;align-items:center;flex-direction:column;gap:20px}.page{background:white;box-shadow:0 3px 18px #263c2c20;width:min(100%,794px);overflow:hidden}.page svg{width:100%;height:auto;display:block}.message{color:#a64238;white-space:pre-wrap}.hidden{display:none}@media(max-width:550px){header{padding:0 14px}.brand small{display:none}button,.choose{padding:10px}.info{margin-top:20px}.page{width:100%}}
</style></head><body><header><div class="brand">한 장 <small>HWPX READER</small></div><div class="actions"><label class="choose" for="file">파일 열기</label><button class="primary" id="pdf" disabled>PDF로 저장</button></div></header><input id="file" type="file" accept=".hwpx,application/hwp+zip"><div class="info"><span id="name">내 문서</span><span id="status">브라우저에서 안전하게</span></div><main><section id="empty" class="empty"><div id="drop" class="drop"><div class="icon">▤</div><h1>한글 문서를 가볍게 열어요</h1><p>HWPX 파일을 여기에 놓거나 선택하세요.<br>문서는 이 기기를 떠나지 않습니다.</p><label for="file" class="choose">HWPX 파일 선택</label><div class="privacy">서버 업로드 없이 브라우저에서 처리</div></div></section><div id="error" class="info message" role="alert"></div><div id="pages" class="pages"></div></main><script type="module" src="./app.js"></script></body></html>
